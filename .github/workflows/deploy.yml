# Pruebas en cada push y pull request. Al subir a main (o con el botón "Run workflow"),
# se publica (las pruebas se muestran pero aún no frenan la publicación) en el VPS: /var/www/clientes/asociacion-futbol-catemu/erp/pitazo-final-erp
name: Pruebas y deploy

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-afc-pitazo
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    # Hay 7 pruebas de Breeze desactualizadas: se informan sin frenar el deploy
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: pruebas
          MARIADB_DATABASE: pitazo_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pitazo_test
      DB_USERNAME: root
      DB_PASSWORD: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, bcmath, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, gd, zip, bcmath, pdo_mysql
          coverage: none
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
      # Se compila en GitHub y no en el VPS (React + Vite)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Empaquetar
        run: |
          echo "VERSION=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          tar --exclude=.git --exclude=.github --exclude=tests --exclude=storage \
              --exclude=node_modules --exclude=.env --exclude=oficios_generados -czf /tmp/release.tar.gz .

      - name: Llave SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Subir y activar
        env:
          DESTINO: deploy@${{ secrets.VPS_HOST }}
          BASE: /var/www/clientes/asociacion-futbol-catemu/erp/pitazo-final-erp/releases
        run: |
          SSH="ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes"
          $SSH "$DESTINO" "mkdir -p $BASE/$VERSION"
          $SSH "$DESTINO" "tar -xzf - -C $BASE/$VERSION" < /tmp/release.tar.gz
          $SSH "$DESTINO" "bash $BASE/$VERSION/scripts/deploy/activar.sh $VERSION"
